services:
  dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        ROS_DISTRO: ${ROS_DISTRO:-jazzy}   # set ROS_DISTRO=humble on the host for Humble
        USERNAME: ubuntu
        USER_UID: ${UID:-1000}
        USER_GID: ${GID:-1000}
        WS_NAME: ros2_ws
    image: vsc_vicon4px4_dev:${ROS_DISTRO:-jazzy}
    container_name: devcontainer_vicon4px4

    # Interactive shell
    stdin_open: true 
    tty: true        
    user: ubuntu

    # Privileged, GPU access and host networking
    network_mode: host
    hostname: localhost
    privileged: true

    # Environment variables
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1

    # Volumes 
    volumes:
      # The repo is the workspace's src/ directory
      - ..:/home/ubuntu/ros2_ws/src
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev:/dev
